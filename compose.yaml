name: vs-code-sonoro

services:
  editor:
    build: .
    restart: unless-stopped
    ports:
      - "${SONORO_BIND:-0.0.0.0}:${SONORO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
